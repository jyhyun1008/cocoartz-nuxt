services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cocoartz
      POSTGRES_PASSWORD: cocoartz
      POSTGRES_DB: cocoartz
    # db는 app 컨테이너에서 내부 도커 네트워크(db:5432)로만 접속하면 되지만, 로컬 개발 중엔
    # 호스트에서 직접 drizzle-kit(db:generate/db:push)을 돌려야 해서 .env의
    # DATABASE_URL(localhost:5432)에 맞춰 포트를 열어둡니다. 운영 배포 시엔 다시 주석 처리해도 됩니다.
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: jyhyun1008/cocoartz:latest
    # 로컬에서 직접 소스를 빌드해서 쓰고 싶으면 위 image 줄을 지우고 아래 주석을 해제하세요.
    # build: .
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # DATABASE_URL은 서버 코드가 process.env를 직접 읽어서(nuxt runtimeConfig를 안 거침)
      # 컨테이너 실행 시점 값 그대로 반영됨 — 접두사 없이 그대로 사용
      DATABASE_URL: postgresql://cocoartz:cocoartz@db:5432/cocoartz
      # 로그인 세션 쿠키 서명·암호화 키 — 32자 이상 랜덤 문자열로 꼭 바꿔서 쓰세요
      # (예: openssl rand -base64 32). 안 바꾸면 컨테이너를 재시작할 때마다 전체 유저 로그인이
      # 풀립니다. DATABASE_URL과 마찬가지로 접두사 없이 그대로 씀.
      SESSION_SECRET: change-me-to-a-random-32-char-string-before-deploying
      # 아래는 전부 nuxt.config.ts의 runtimeConfig로 들어가는 값들이라 NUXT_ 접두사가 필수입니다.
      # (접두사 없이 DOMAIN=... 처럼만 주면 "docker build" 시점에 .env가 없어서 빈 값으로
      #  이미지에 굳어버리고, 여기 environment:로 아무리 값을 줘도 무시됨 — 실제로 겪었던
      #  "팔로우가 대기중에서 안 움직인다"/"https:///..." 버그의 원인이었음)
      # 실제 배포 시 아래 두 값을 진짜 도메인으로 바꾸세요 (NUXT_DOMAIN은 프로토콜 제외, HTTPS로 외부 접근 가능해야 함)
      NUXT_PUBLIC_API_BASE_URL: https://yourdomain.com
      NUXT_DOMAIN: yourdomain.com
      NUXT_PUBLIC_SERVER_SLUG: cocoartz
      # 서버 언어 — 유저별이 아니라 이 서버 전체가 쓰는 언어(ko/ja/zh, 기본 ko). docs/ops/04-다국어-지원.md 참고
      NUXT_PUBLIC_LOCALE: ko
      # 오브젝트 스토리지 (선택 — S3 호환. 비워두면 업로드 기능 없이 URL 입력만 가능)
      NUXT_S3_ENDPOINT: ""
      NUXT_S3_REGION: "auto"
      NUXT_S3_BUCKET: ""
      NUXT_S3_ACCESS_KEY_ID: ""
      NUXT_S3_SECRET_ACCESS_KEY: ""
      NUXT_S3_PUBLIC_URL_BASE: ""
      NUXT_S3_FORCE_PATH_STYLE: "false"
    depends_on:
      - db

volumes:
  pgdata:
