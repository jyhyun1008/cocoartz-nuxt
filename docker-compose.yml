services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cocoartz
      POSTGRES_PASSWORD: cocoartz
      POSTGRES_DB: cocoartz
    # db는 app 컨테이너에서 내부 도커 네트워크(db:5432)로만 접속하면 되므로
    # 호스트에 포트를 열어둘 필요가 없어서 아예 뺐습니다. 외부에서 DB에 직접 붙어야 하면
    # (예: pgAdmin/TablePlus) 아래처럼 원하는 호스트 포트로 열어주세요.
    # ports:
    #   - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: jyhyun1008/cocoartz:latest
    # 로컬에서 직접 소스를 빌드해서 쓰고 싶으면 위 image 줄을 지우고 아래 주석을 해제하세요.
    # build: .
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://cocoartz:cocoartz@db:5432/cocoartz
      # 실제 배포 시 아래 두 값을 진짜 도메인으로 바꾸세요 (DOMAIN은 프로토콜 제외, HTTPS로 외부 접근 가능해야 함)
      API_BASEURL: https://yourdomain.com
      DOMAIN: yourdomain.com
      # 오브젝트 스토리지 (선택 — S3 호환. 비워두면 업로드 기능 없이 URL 입력만 가능)
      S3_ENDPOINT: ""
      S3_REGION: "auto"
      S3_BUCKET: ""
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      S3_PUBLIC_URL_BASE: ""
      S3_FORCE_PATH_STYLE: "false"
    depends_on:
      - db

volumes:
  pgdata:
